[build-system]
requires = ["setuptools >= 77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vida_py"
dynamic = ["readme", "version"]
description = "Python interface for Volvo's VIDA databases."
keywords = ["VIDA", "volvo"]
authors = [{ name = "Kestin Goforth", email = "kgoforth1503@gmail.com" }]
dependencies = ["click>=8.1.8", "pyodbc>=5.2.0", "SQLAlchemy>=2.0.41"]
requires-python = '>= 3.13'
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
homepage = "https://github.com/kforth/vida_py"
repository = "https://github.com/kforth/vida_py"
bugs = "https://github.com/kForth/vida_py/issues"

[dependency-groups]
dev = [
  "black==26.5.*",
  "codespell==2.4.*",
  "isort==8.0.*",
  "mypy==2.3.*",
  "pytest==8.4.*",
  "pylint==4.0.*",
  "ruff==0.15.*",
  "pre-commit==4.2.0",
]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools]
package-dir = { "vida_py" = "vida_py" }

[tool.setuptools.package-data]
"*" = ["README.md", "LICENSE"]

[tool.setuptools.packages.find]
include = ["vida_py*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "I",   # isort
  "N",   # pep8-naming
  "PGH", # pygrep-hooks
  "PL",  # pylint
  "RUF", # ruff-specific rules
  "T20", # flake8-print
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
  "YTT", # flake8-2020
]
ignore = [
  "B026", # star-arg-unpacking-after-keyword-arg
  "PLR",  # pylint refactor
]

[tool.black]
line-length = 100
include = '(vida_py|.github|examples|scripts).*\.pyi?$'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 90
known_first_part = 'vida_py'

[tool.codespell]
skip = '.git,setup.cfg'
ignore-words = '.codespell_ignore_words'
quiet-level = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require a live VIDA database connection"]
